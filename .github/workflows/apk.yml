name: APK

# À chaque push : tests et compilation de l'APK signé. Publication dans une release « apk-<numéro> » marquée comme la
# dernière, uniquement depuis la branche par défaut du dépôt (les autres branches gardent l'APK en artefact). La
# nouvelle release est créée avant de retirer les anciennes : il y a toujours un meteo.apk à télécharger.
# Lien direct pour le téléphone : https://github.com/<propriétaire>/<dépôt>/releases/latest/download/meteo.apk
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Une file par branche : un push sur une autre branche n'annule pas la publication en cours.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Tests et compilation
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk meteo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: meteo-apk
          path: meteo.apk

      - name: Publier l'APK
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" meteo.apk \
            --title "Météo – dernière version" \
            --notes "APK compilé automatiquement depuis la branche ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}). Ouvre ce lien depuis le téléphone pour l'installer." \
            --target "$GITHUB_SHA" \
            --latest \
            || gh release upload "$TAG" meteo.apk --clobber
          # gh crée la release en brouillon le temps d'envoyer l'APK : on s'assure qu'elle est bien publiée (un
          # brouillon n'est pas « la dernière version » et reste invisible pour les téléphones).
          gh release edit "$TAG" --draft=false --latest
          # Seulement ensuite, les anciennes (dont l'ancienne « apk-latest »).
          for old in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            case "$old" in
              "$TAG") ;;
              apk-*) gh release delete "$old" --cleanup-tag --yes || true ;;
            esac
          done
