name: Webapp

# La webapp (pour iPhone et tout navigateur), publiée sur GitHub Pages à chaque push sur la branche par défaut :
# https://<propriétaire>.github.io/<dépôt>/
# Une fois pour toutes : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Compilation de la webapp
        run: ./gradlew --no-daemon :web:site

      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: web/build/site

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
